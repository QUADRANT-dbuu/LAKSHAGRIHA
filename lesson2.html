<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newton's Challenge | Rural Ed</title>
    <style>
        :root { --p: #059669; --s: #10b981; --err: #ef4444; --bg: #f0fdf4; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); padding: 20px; }
        .card { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        /* Game Stats */
        .stats-bar { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: bold; font-size: 1.1rem; }
        .hearts { color: var(--err); font-size: 1.5rem; }

        /* Story & Reading */
        .story-box { background: #f8fafc; border-left: 6px solid var(--p); padding: 20px; margin-bottom: 25px; border-radius: 8px; transition: 0.3s; }
        
        /* Buttons */
        .option-btn { width: 100%; text-align: left; padding: 15px; margin: 8px 0; border: 2px solid #e2e8f0; border-radius: 12px; background: white; cursor: pointer; font-size: 1rem; }
        .option-btn:hover { border-color: var(--p); background: #f0fdf4; }
        
        .btn-action { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #next-btn { background: var(--p); color: white; display: none; }
        #retry-btn { background: #64748b; color: white; display: none; }
        
        .success-text { color: var(--p); font-weight: bold; text-align: center; display: none; }
    </style>
</head>
<body>

<div class="card">
    <div class="stats-bar">
        <div id="level-display">Level: 1/3</div>
        <div class="hearts" id="life-display">❤️❤️❤️</div>
        <select id="langSelect" onchange="loadQuestion()">
            <option value="en">English</option>
            <option value="hi">Hindi (हिन्दी)</option>
            <option value="te">Telugu (తెలుగు)</option>
        </select>
    </div>

    <div class="story-box" id="content-area">
        <h3 id="q-title">Reading Passage</h3>
        <p id="q-text">Loading...</p>
    </div>

    <div id="options-area"></div>

    <p class="success-text" id="feedback">✨ Correct! You understood the law.</p>
    
    <button id="next-btn" class="btn-action" onclick="changeLevel(1)">Next Level ➔</button>
    <button id="retry-btn" class="btn-action" onclick="resetGame()">Game Over: Try Again? 🔄</button>
</div>

<script>
    const quizData = [
        {
            en: { title: "Level 1: Inertia", text: "A bicycle stays still until you push the pedals. This is the 1st Law. It says objects like to keep doing what they are doing. This 'laziness' of objects is called Inertia.", q: "What is the 'laziness' of the bicycle called?", opts: ["Friction", "Inertia", "Gravity"], ans: 1 },
            hi: { title: "स्तर 1: जड़त्व (Inertia)", text: "एक साइकिल तब तक स्थिर रहती है जब तक आप पैडल नहीं मारते। यह पहला नियम है। यह कहता है कि वस्तुएं वही करना पसंद करती हैं जो वे कर रही हैं। वस्तुओं के इस 'आलस्य' को जड़त्व कहा जाता है।", q: "वस्तुओं के इस 'आलस्य' को क्या कहा जाता है?", opts: ["घर्षण", "जड़त्व", "गुरुत्वाकर्षण"], ans: 1 },
            te: { title: "స్థాయి 1: జడత్వం", text: "మీరు పెడల్స్ తొక్కే వరకు సైకిల్ కదలకుండా ఉంటుంది. ఇది 1వ నియమం. వస్తువులు తాము చేస్తున్న పనినే కొనసాగించడానికి ఇష్టపడతాయని ఇది చెబుతుంది. వస్తువుల ఈ 'బద్ధకాన్ని' జడత్వం అంటారు.", q: "వస్తువుల ఈ 'బద్ధకాన్ని' ఏమంటారు?", opts: ["ఘర్షణ", "జడత్వం", "గురుత్వాకర్షణ"], ans: 1 }
        },
        {
            en: { title: "Level 2: F = ma", text: "To move a heavy truck, you need a big force. To move a light toy car, you need a small force. Acceleration depends on mass and force. This is the 2nd Law.", q: "Which needs more force to accelerate?", opts: ["A heavy truck", "A light toy car", "Both are same"], ans: 0 },
            hi: { title: "स्तर 2: बल और त्वरण", text: "एक भारी ट्रक को चलाने के लिए बड़े बल की आवश्यकता होती है। एक हल्की खिलौना कार के लिए कम बल चाहिए। त्वरण द्रव्यमान और बल पर निर्भर करता है।", q: "किसे चलाने के लिए अधिक बल की आवश्यकता है?", opts: ["भारी ट्रक", "हल्की खिलौना कार", "दोनों समान हैं"], ans: 0 },
            te: { title: "స్థాయి 2: బలం మరియు త్వరణం", text: "భారీ ట్రక్కును కదపడానికి పెద్ద బలం అవసరం. తేలికపాటి బొమ్మ కారుకు తక్కువ బలం అవసరం. త్వరణం ద్రవ్యరాశి మరియు బలంపై ఆధారపడి ఉంటుంది.", q: "దేనిని కదపడానికి ఎక్కువ బలం అవసరం?", opts: ["భారీ ట్రక్కు", "తేలికపాటి బొమ్మ కారు", "రెండూ సమానం"], ans: 0 }
        },
        {
            en: { title: "Level 3: Action & Reaction", text: "When you jump off a boat into the water, you push the boat backward. The boat pushes you forward. Every action has an equal and opposite reaction. This is the 3rd Law.", q: "If you push a wall, what does the wall do?", opts: ["Nothing", "Pushes you back", "Falls down"], ans: 1 },
            hi: { title: "स्तर 3: क्रिया और प्रतिक्रिया", text: "जब आप नाव से पानी में कूदते हैं, तो आप नाव को पीछे धकेलते हैं। नाव आपको आगे धकेलती है। प्रत्येक क्रिया की समान और विपरीत प्रतिक्रिया होती है।", q: "यदि आप दीवार को धक्का देते हैं, तो दीवार क्या करती है?", opts: ["कुछ नहीं", "आपको वापस धकेलती है", "गिर जाती है"], ans: 1 },
            te: { title: "స్థాయి 3: చర్య మరియు ప్రతిచర్య", text: "మీరు పడవ నుండి నీటిలోకి దూకినప్పుడు, మీరు పడవను వెనక్కి నెడతారు. పడవ మిమ్మల్ని ముందుకు నెడుతుంది. ప్రతి చర్యకు సమానమైన మరియు వ్యతిరేక ప్రతిచర్య ఉంటుంది.", q: "మీరు గోడను నెట్టినప్పుడు, గోడ ఏమి చేస్తుంది?", opts: ["ఏమీ చేయదు", "మిమ్మల్ని వెనక్కి నెడుతుంది", "క్రింద పడిపోతుంది"], ans: 1 }
        }
    ];

    let currentLevel = 0;
    let lives = 3;

    function loadQuestion() {
        const lang = document.getElementById('langSelect').value;
        const levelData = quizData[currentLevel][lang];
        
        document.getElementById('level-display').innerText = `Level: ${currentLevel + 1}/3`;
        document.getElementById('q-title').innerText = levelData.title;
        document.getElementById('q-text').innerText = levelData.text;
        
        const optionsArea = document.getElementById('options-area');
        optionsArea.innerHTML = `<p><b>${levelData.q}</b></p>`;
        
        levelData.opts.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(idx, levelData.ans);
            optionsArea.appendChild(btn);
        });

        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('feedback').style.display = 'none';
    }

    function checkAnswer(idx, correctIdx) {
        if (lives <= 0) return;

        const btns = document.querySelectorAll('.option-btn');
        if (idx === correctIdx) {
            btns[idx].style.background = "#dcfce7";
            btns[idx].style.borderColor = "var(--p)";
            document.getElementById('feedback').style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
        } else {
            btns[idx].style.background = "#fee2e2";
            btns[idx].style.borderColor = "var(--err)";
            lives--;
            updateLives();
            if (lives === 0) endGame();
        }
    }

    function updateLives() {
        const display = document.getElementById('life-display');
        display.innerText = "❤️".repeat(lives) + "🖤".repeat(3 - lives);
    }

    function changeLevel(dir) {
        currentLevel += dir;
        if (currentLevel < quizData.length) {
            loadQuestion();
        } else {
            document.getElementById('content-area').innerHTML = "<h2>🎉 Champion!</h2><p>You have mastered the Laws of Motion.</p>";
            document.getElementById('options-area').innerHTML = "";
            document.getElementById('next-btn').style.display = 'none';
        }
    }

    function endGame() {
        document.getElementById('options-area').innerHTML = "<h2 style='color:red;'>Out of Lives!</h2>";
        document.getElementById('retry-btn').style.display = 'block';
    }

    function resetGame() {
        lives = 3;
        currentLevel = 0;
        updateLives();
        document.getElementById('retry-btn').style.display = 'none';
        loadQuestion();
    }

    // Initial Load
    loadQuestion();
</script>
</body>
</html>
