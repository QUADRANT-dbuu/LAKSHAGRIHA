<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inertia Lab | Pizza Delivery</title>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    
    <style>
        :root { 
            --car: #3b82f6;
            --pizza: #fbbf24;
            --road: #1e293b;
        }
        
        body { 
            font-family: 'Comic Sans MS', sans-serif;
            background-color: #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        #google_translate_element { margin-bottom: 20px; }

        .theory-card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            border-bottom: 8px solid var(--car);
            max-width: 500px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* The Animation Stage */
        #stage {
            width: 550px;
            height: 150px;
            background: #fff;
            border: 4px solid #000;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
        }

        #car {
            width: 140px;
            height: 60px;
            background: var(--car);
            border: 3px solid #000;
            border-radius: 10px 30px 5px 5px;
            position: absolute;
            bottom: 20px;
            left: 20px;
            transition: left 0.8s ease-in-out;
        }

        #pizza-box {
            width: 50px;
            height: 10px;
            background: var(--pizza);
            border: 2px solid #b45309;
            position: absolute;
            top: -15px;
            left: 40px;
            transition: left 0.5s ease-out, transform 0.5s ease-out;
        }

        .wheel {
            width: 25px;
            height: 25px;
            background: #000;
            border-radius: 50%;
            position: absolute;
            bottom: -12px;
        }

        .controls { margin-top: 25px; display: flex; gap: 15px; }

        button {
            padding: 12px 25px;
            font-weight: bold;
            border-radius: 10px;
            border: 2px solid #000;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="google_translate_element"></div>

    <div class="theory-card" onclick="speakText(this.innerText)">
        <h2>The "Lazy" Pizza Box</h2>
        <p>A pizza box is **lazy**. If it is moving, it wants to **keep moving**. If the car stops, the pizza keeps going until it hits the floor!</p>
    </div>

    

    <div id="stage">
        <div id="car">
            <div id="pizza-box"></div>
            <div class="wheel" style="left: 15px;"></div>
            <div class="wheel" style="right: 15px;"></div>
        </div>
        <div style="width: 100%; height: 20px; background: var(--road);"></div>
    </div>

    <div class="controls">
        <button style="background: #22c55e; color: white;" onclick="drive()">1. DRIVE FAST ➔</button>
        <button style="background: #ef4444; color: white;" onclick="slamBrakes()">2. SLAM BRAKES! 🛑</button>
        <button style="background: #e2e8f0;" onclick="resetSim()">🔄 RESET</button>
    </div>

    <div style="margin-top: 30px;">
        <a href="second_law.html" style="text-decoration: none; color: #3b82f6; font-weight: bold;">Next: The Heavy Rocket (2nd Law) ➔</a>
    </div>

<script>
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'hi,te,en,ta,bn,mr',
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE
        }, 'google_translate_element');
    }

    const car = document.getElementById('car');
    const pizza = document.getElementById('pizza-box');

    function drive() {
        car.style.left = "300px";
        speakText("The car is moving. The pizza is moving too.");
    }

    function slamBrakes() {
        // Car stops at 320px
        car.style.left = "320px";
        
        // Pizza keeps moving forward (Inertia!)
        setTimeout(() => {
            pizza.style.left = "180px"; // It slides off the car
            pizza.style.transform = "rotate(20deg) translateY(40px)"; 
            speakText("Stop! But the pizza keeps moving forward. Oops!");
        }, 100);
    }

    function resetSim() {
        car.style.transition = "none";
        pizza.style.transition = "none";
        car.style.left = "20px";
        pizza.style.left = "40px";
        pizza.style.transform = "rotate(0deg) translateY(0px)";
        setTimeout(() => {
            car.style.transition = "left 0.8s ease-in-out";
            pizza.style.transition = "left 0.5s ease-out, transform 0.5s ease-out";
        }, 50);
    }

    function speakText(t) {
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(t));
    }
</script>
</body>
</html>
