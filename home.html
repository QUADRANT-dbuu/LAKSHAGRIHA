<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InclusiveLearn | Comprehensive Assessment</title>
    <style>
        :root { --primary: #4A90E2; --bg: #FDFBF7; --text: #333; --accent: #FFCC00; --mic: #E91E63; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-x: hidden; }
        #app-container { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 95%; max-width: 700px; text-align: center; position: relative; }
        .hidden { display: none; }
        .btn { background: var(--primary); color: white; border: none; padding: 15px 35px; font-size: 1.1rem; border-radius: 50px; cursor: pointer; margin: 10px; transition: 0.3s; font-weight: bold; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .mic-btn { background: var(--mic); }
        .mic-btn.listening { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0px rgba(233, 30, 99, 0.4); } 70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(233, 30, 99, 0); } 100% { transform: scale(1); } }
        .option-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px; }
        .option-btn { background: #f8f9fa; border: 2px solid #eee; padding: 20px; font-size: 1.5rem; border-radius: 12px; cursor: pointer; transition: 0.2s; }
        .option-btn:hover { border-color: var(--primary); background: #f0f7ff; }
        .progress-bar { height: 10px; background: #eee; border-radius: 5px; margin-bottom: 20px; overflow: hidden; }
        #progress-fill { height: 100%; background: var(--primary); width: 0%; transition: 0.4s; }
        .word-display { font-size: 3.5rem; font-weight: bold; color: var(--primary); margin: 20px 0; letter-spacing: 3px; text-transform: uppercase; }
        .tag { display: inline-block; padding: 6px 15px; background: #e3f2fd; color: #1565c0; border-radius: 20px; font-size: 0.85rem; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; }
        #speech-status { font-style: italic; color: #666; margin-top: 10px; min-height: 1.2em; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="setup-screen">
        <h1 style="color: var(--primary);">InclusiveLearn Assessment</h1>
        <p>A multi-sensory tool to understand how your brain processes information.</p>
        <div style="margin: 30px 0;">
            <label style="font-size: 1.2rem;">How old are you? </label>
            <input type="number" id="age-input" min="5" max="15" value="8" style="padding:10px; font-size:1.2rem; width:70px; border-radius:8px; border:2px solid #ddd;">
        </div>
        <button class="btn" onclick="startAssessment()">Begin Test</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <div class="progress-bar"><div id="progress-fill"></div></div>
        <div id="category-tag" class="tag">Loading...</div>
        <h2 id="instruction" style="margin-top:0;">Listen carefully...</h2>
        
        <div id="standard-ui">
            <button class="btn" style="background: var(--accent); color: #000;" onclick="playSound()">🔊 Play Sound</button>
            <div class="option-grid" id="options"></div>
        </div>

        <div id="speech-ui" class="hidden">
            <div id="target-word-display" class="word-display">WORD</div>
            <button id="mic-btn" class="btn mic-btn" onclick="startSpeechRecognition()">🎤 Click to Say Word</button>
            <p id="speech-status">Waiting for your voice...</p>
        </div>
    </div>

    <div id="result-screen" class="hidden">
        <h2 style="color: var(--primary);">Assessment Complete</h2>
        <p id="res-score" style="font-size: 1.3rem; font-weight: bold;"></p>
        <div id="analysis-box" style="text-align: left; background: #f1f8ff; padding: 25px; border-radius: 15px; margin: 25px 0; line-height: 1.6;">
            <p id="res-detail"></p>
        </div>
        <button class="btn" onclick="location.reload()">Take Test Again</button>
    </div>
</div>

<script>
    const allQuestionSets = {
        tier1: [
            { word: "b", options: ["d", "b", "p", "q"], correct: "b", type: "mirror" },
            { word: "Cat", type: "speech" },
            { word: "p", options: ["q", "g", "p", "d"], correct: "p", type: "mirror" },
            { word: "no", options: ["on", "no", "un", "mo"], correct: "no", type: "reversal" },
            { word: "Sun", type: "speech" },
            { word: "m", options: ["n", "w", "m", "v"], correct: "m", type: "mirror" },
            { word: "bat", options: ["cat", "dog", "sun", "pig"], correct: "bat", type: "rhyme" },
            { word: "1 2 3", options: ["5", "4", "6", "0"], correct: "4", type: "sequence" },
            { word: "top", options: ["pot", "top", "dot", "cop"], correct: "top", type: "reversal" },
            { word: "Bed", type: "speech" },
            { word: "A B C", options: ["D", "E", "F", "G"], correct: "D", type: "sequence" },
            { word: "d", options: ["b", "d", "p", "q"], correct: "d", type: "mirror" },
            { word: "blue", options: ["shoe", "red", "black", "sky"], correct: "shoe", type: "rhyme" },
            { word: "Star", type: "speech" },
            { word: "saw", options: ["was", "saw", "raw", "war"], correct: "saw", type: "reversal" }
        ],
        tier2: [
            { word: "was", options: ["saw", "was", "nas", "mas"], correct: "was", type: "reversal" },
            { word: "Hospital", type: "speech" },
            { word: "said", options: ["sed", "said", "siad", "sade"], correct: "said", type: "spelling" },
            { word: "bird", options: ["dird", "bird", "brid", "pird"], correct: "bird", type: "mirror" },
            { word: "from", options: ["form", "from", "fron", "vrom"], correct: "from", type: "reversal" },
            { word: "Adventure", type: "speech" },
            { word: "Monday Tuesday", options: ["Friday", "Wednesday", "Sunday", "Thursday"], correct: "Wednesday", type: "sequence" },
            { word: "friend", options: ["freind", "friend", "frend", "firend"], correct: "friend", type: "spelling" },
            { word: "quiet", options: ["quite", "quiet", "quilt", "qiuet"], correct: "quiet", type: "spelling" },
            { word: "Elephant", type: "speech" },
            { word: "January February", options: ["April", "March", "May", "June"], correct: "March", type: "sequence" },
            { word: "left", options: ["felt", "left", "lefty", "lift"], correct: "left", type: "visual" },
            { word: "snack", options: ["snack", "snak", "sank", "scank"], correct: "snack", type: "spelling" },
            { word: "Butterfly", type: "speech" },
            { word: "night", options: ["night", "niht", "nite", "nigth"], correct: "night", type: "spelling" }
        ],
        tier3: [
            { word: "plimsol", options: ["plimsoll", "pilmsol", "plimsol", "plisom"], correct: "plimsol", type: "nonsense" },
            { word: "Ambidextrous", type: "speech" },
            { word: "enough", options: ["enuff", "enough", "enouf", "anough"], correct: "enough", type: "spelling" },
            { word: "rhythm", options: ["rythm", "rhythm", "rythum", "rithm"], correct: "rhythm", type: "spelling" },
            { word: "Specific", type: "speech" },
            { word: "accommodation", options: ["acomodation", "accommodation", "accomodation", "acommodation"], correct: "accommodation", type: "spelling" },
            { word: "necessary", options: ["necesary", "nesecary", "necessary", "neccessary"], correct: "necessary", type: "spelling" },
            { word: "gorp", options: ["grop", "gorp", "borg", "pog"], correct: "gorp", type: "nonsense" },
            { word: "Philosophy", type: "speech" },
            { word: "summarize", options: ["sumerize", "summarize", "sumerise", "sumarize"], correct: "summarize", type: "spelling" },
            { word: "12 minus 4", options: ["6", "8", "7", "9"], correct: "8", type: "math" },
            { word: "flaptick", options: ["faltick", "flaptick", "flaptik", "flapitck"], correct: "flaptick", type: "nonsense" },
            { word: "Encyclopedia", type: "speech" },
            { word: "Tuesday Thursday", options: ["Friday", "Saturday", "Monday", "Sunday"], correct: "Saturday", type: "sequence" },
            { word: "February April", options: ["June", "May", "August", "July"], correct: "June", type: "sequence" }
        ]
    };

    let activeSet = [], currentIdx = 0, score = 0, nudgeTimer, recognition;
    let results = { mirror: 0, reversal: 0, speech: 0, sequence: 0, nonsense: 0, totalErrors: 0 };

    if ('webkitSpeechRecognition' in window) {
        recognition = new webkitSpeechRecognition();
        recognition.lang = 'en-US';
        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript.toLowerCase();
            const target = activeSet[currentIdx].word.toLowerCase();
            document.getElementById('mic-btn').classList.remove('listening');
            document.getElementById('speech-status').innerText = `Heard: "${transcript}"`;
            setTimeout(() => handleAnswer(transcript === target ? target : "error"), 1000);
        };
        recognition.onend = () => document.getElementById('mic-btn').classList.remove('listening');
    }

    function startAssessment() {
        const age = parseInt(document.getElementById('age-input').value);
        if (age <= 7) activeSet = allQuestionSets.tier1;
        else if (age <= 11) activeSet = allQuestionSets.tier2;
        else activeSet = allQuestionSets.tier3;

        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        loadQuestion();
    }

    function loadQuestion() {
        const q = activeSet[currentIdx];
        document.getElementById('progress-fill').style.width = `${(currentIdx / activeSet.length) * 100}%`;
        document.getElementById('category-tag').innerText = q.type;
        clearTimeout(nudgeTimer);

        if (q.type === 'speech') {
            document.getElementById('standard-ui').classList.add('hidden');
            document.getElementById('speech-ui').classList.remove('hidden');
            document.getElementById('instruction').innerText = "Read this word out loud:";
            document.getElementById('target-word-display').innerText = q.word;
            document.getElementById('speech-status').innerText = "Waiting...";
            nudgeTimer = setTimeout(() => {
                window.speechSynthesis.speak(new SpeechSynthesisUtterance("You're doing great. Try saying the word now!"));
                document.getElementById('speech-status').innerText = "Don't worry, just try your best!";
            }, 10000);
        } else {
            document.getElementById('speech-ui').classList.add('hidden');
            document.getElementById('standard-ui').classList.remove('hidden');
            document.getElementById('instruction').innerText = "Choose the correct answer:";
            const grid = document.getElementById('options');
            grid.innerHTML = '';
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => handleAnswer(opt);
                grid.appendChild(btn);
            });
        }
    }

    function startSpeechRecognition() {
        clearTimeout(nudgeTimer);
        document.getElementById('mic-btn').classList.add('listening');
        document.getElementById('speech-status').innerText = "Listening...";
        recognition.start();
    }

    function playSound() {
        const msg = new SpeechSynthesisUtterance(activeSet[currentIdx].word);
        msg.rate = 0.8;
        window.speechSynthesis.speak(msg);
    }

    function handleAnswer(choice) {
        clearTimeout(nudgeTimer);
        const q = activeSet[currentIdx];
        const isSpeechCorrect = q.type === 'speech' && choice === q.word.toLowerCase();
        const isStandardCorrect = q.type !== 'speech' && choice === q.correct;

        if (!isSpeechCorrect && !isStandardCorrect) {
            results.totalErrors++;
            if (results[q.type] !== undefined) results[q.type]++;
        } else {
            score++;
        }

        currentIdx++;
        if (currentIdx < activeSet.length) loadQuestion();
        else finalizeResults();
    }

    function finalizeResults() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('res-score').innerText = `Accuracy: ${score} / ${activeSet.length}`;

        let detail = "<b>Analysis of Learning Patterns:</b><br><br>";
        let flags = [];
        if (results.mirror > 2) flags.push("Frequent <b>Letter Orientation</b> errors (Mirroring).");
        if (results.reversal > 2) flags.push("Patterns of <b>Word Reversal</b> (Visual Sequencing).");
        if (results.speech > 1) flags.push("Challenges in <b>Phonological Retrieval</b> (Speech output).");
        if (results.nonsense > 1) flags.push("Difficulty <b>Decoding</b> unfamiliar phonetic patterns.");
        if (results.sequence > 1) flags.push("Struggles with <b>Sequential Memory</b> of information.");

        if (flags.length === 0) {
            detail += "Your performance is within the standard range. You show strong processing skills!";
        } else {
            detail += "Based on the assessment, we noticed the following:<br><ul><li>" + flags.join("</li><li>") + "</li></ul>";
            detail += "<br>These markers are common in students who learn differently. We recommend activating <b>Inclusive Learning Features</b>.";
        }
        document.getElementById('res-detail').innerHTML = detail;
    }
</script>
</body>
</html>
